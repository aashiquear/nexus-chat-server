      # Defaults to HuggingFace's default cache (~/.cache/huggingface/).
      # model_cache_dir: "./data/models"

  file_generator:
    enabled: true
    name: "File Generator"
    description: "Generate PDF, DOCX, PPTX, and PNG files from content provided by the LLM"
    icon: "file-text"
    config:
      output_dir: "./data/downloads"

# ------------------------------------------------------------
# MCP Servers (Model Context Protocol)
# ------------------------------------------------------------
# Nexus speaks every MCP transport:
#   url:     "http://host:port/mcp"        → streamable-http (auto-detected)
#   url:     "http://host:port/sse"        → legacy HTTP+SSE
#   url:     "http://host:port"            → legacy Nexus /rpc servers
#   command: "npx" args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
#                                           → stdio (marketplace / Claude
#                                             Desktop style servers)
# Servers can also be added at runtime from the sidebar "MCP Marketplace"
# (official registry search, import of a Claude/ChatGPT ``mcpServers``
# JSON block, or a manual URL/command); those are stored in
# data/mcp_servers.json and survive restarts.
# ------------------------------------------------------------
mcp_servers:
  # Example: stdio server from the npm marketplace (needs node in the image)
  # filesystem:
  #   enabled: true
  #   name: "Filesystem"
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/app/data/uploads"]

  # Example: SQLite database server (see examples/mcp-database-server)
  database:
    enabled: false
    name: "Database"
    description: "Query and manage a SQLite database"
    url: "http://mcp-database:8100" # Docker service name
    icon: "database"
    timeout: 30

  moose:
    enabled: false
    name: "MOOSE Simulator"
    description: "Build, run, and post-process MOOSE framework simulations"
    # Native mode: use host.docker.internal to reach the host from Docker
    url: "http://host.docker.internal:8200"
    # Docker mode: use the container name instead
    # url: "http://mcp-moose:8200"
    icon: "atom"
    timeout: 120

  statflow:
    enabled: false
    name: "StatFlow - Statistical Analysis"
    url: "http://statflow-mcp:9000" # container name on nexus-net
    icon: "chart-bar"
    timeout: 120 # longer timeout for complex analyses

# ------------------------------------------------------------
# RAG (Retrieval-Augmented Generation)
# ------------------------------------------------------------
rag:
  enabled: true
  chunk_size: 1000
  chunk_overlap: 200
  # Embedding provider: "local" (sentence-transformers) or "openai"
  embedding_provider: "local"
  embedding_model: "all-MiniLM-L6-v2"
  # Vector store: "chroma" or "faiss"
  vector_store: "chroma"
  persist_directory: "./data/vector_store"
  # Max number of chunks to retrieve
  top_k: 5

# ------------------------------------------------------------
# File Upload
# ------------------------------------------------------------
uploads:
  # 5 GiB — large enough for modern datasets. The upload endpoint streams
  # the request body to disk in 1 MiB chunks, so memory stays bounded
  # regardless of this value.
  max_file_size_mb: 5120
  allowed_extensions: [] # Empty list = allow all file types
  upload_directory: "./data/uploads"

# ============================================================
# Nexus Chat - Configuration
# ============================================================
# Edit this file to configure LLM providers, tools, and RAG.
# Restart the server after making changes.
# ============================================================

app:
  name: "Nexus Chat"
  version: "0.3.0"
  host: "0.0.0.0"
  port: 8000
  debug: false
  # Secret key for sessions (change in production!)
  secret_key: "change-me-in-production"
  # Optional: first paragraph of the default system prompt. Nexus appends
  # today's date, the knowledge-cutoff reminder and tool guidance.
  # system_prompt: "You are Nexus, a helpful, precise AI assistant."

# ------------------------------------------------------------
# LLM Providers
# ------------------------------------------------------------
# Enable/disable providers and set API keys here.
# You can also set keys via environment variables:
#   ANTHROPIC_API_KEY, OPENAI_API_KEY
# ------------------------------------------------------------
providers:
  anthropic:
    enabled: true
    api_key: "${ANTHROPIC_API_KEY}" # Set via env var or paste key here
    default_model: "claude-sonnet-4-6"
    # The /v1/models probe will mark each entry as available or
    # unavailable based on what the API key actually has access to.
    models:
      # --- Latest Claude 4.x line ---
      - id: "claude-opus-4-7"
        name: "Claude Opus 4.7"
        max_tokens: 8192
        context_length: 200000
        thinking: true
        thinking_budget_tokens: 4096
      - id: "claude-opus-4-6"
        name: "Claude Opus 4.6"
        max_tokens: 8192
      - id: "claude-sonnet-4-6"
        name: "Claude Sonnet 4.6"
        max_tokens: 8192
      - id: "claude-haiku-4-5-20251001"
        name: "Claude Haiku 4.5"
        max_tokens: 8192
      # --- Older 4.x ---
      - id: "claude-sonnet-4-20250514"
        name: "Claude Sonnet 4 (May 2025)"
        max_tokens: 8192

  openai:
    enabled: true
    api_key: "${OPENAI_API_KEY}"
    default_model: "gpt-5"
    # Reasoning models (gpt-5, o-series) consult ``thinking_level`` to
    # set ``reasoning_effort`` on the API; non-reasoning models ignore
    # the flag entirely.
    models:
      # --- GPT-5 family (reasoning) ---
      - id: "gpt-5"
        name: "GPT-5"
        max_tokens: 8192
        thinking: true
        thinking_level: "medium"
      - id: "gpt-5-mini"
        name: "GPT-5 Mini"
        max_tokens: 8192
        thinking: true
        thinking_level: "low"
      - id: "gpt-5-nano"
        name: "GPT-5 Nano"
        max_tokens: 4096
        thinking: true
        thinking_level: "minimal"
      # --- o-series (reasoning) ---
      - id: "o3"
        name: "OpenAI o3"
        max_tokens: 8192
        thinking: true
        thinking_level: "medium"
      - id: "o3-mini"
        name: "OpenAI o3-mini"
        max_tokens: 8192
        thinking: true
        thinking_level: "medium"
      - id: "o4-mini"
        name: "OpenAI o4-mini"
        max_tokens: 8192
        thinking: true
        thinking_level: "medium"
      # --- 4.x family ---
      - id: "gpt-4.1"
        name: "GPT-4.1"
        max_tokens: 8192
      - id: "gpt-4o"
        name: "GPT-4o"
        max_tokens: 4096
      - id: "gpt-4o-mini"
        name: "GPT-4o Mini"
        max_tokens: 4096

  ollama:
    enabled: true
    # For local Ollama: http://localhost:11434
    # For Ollama Cloud: https://ollama.com/api (requires OLLAMA_API_KEY)
    base_url: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    api_key: "${OLLAMA_API_KEY}" # Required for Ollama Cloud, leave empty for local
    default_model: "llama3.2"
    # ----
    # Thinking models: set ``thinking: true`` (or ``thinking_level`` in
    # {low, medium, high}) to make Ollama emit the model's thought
    # process. Non-thinking models leave the field unset and are
    # unaffected — switching between the two just works.
    #
    # The Nexus sidebar greys out any model that isn't currently
    # available on the connected Ollama server (i.e. not yet pulled
    # locally, or not in your Ollama Cloud catalog), so it's safe to
    # list aspirational tags below — they'll just be marked unavailable
    # until the server actually has them.
    # ----
    models:
      # --- Cloud models (Ollama Cloud) ---
      - id: "gpt-oss:120b-cloud"
        name: "GPT-OSS 120B (cloud)"
        max_tokens: 8192
        thinking: true
        thinking_level: "medium"
      - id: "qwen3-coder:480b-cloud"
        name: "Qwen 3 Coder 480B (cloud)"
        max_tokens: 8192
      - id: "deepseek-r1:671b-cloud"
        name: "DeepSeek-R1 671B (cloud)"
        max_tokens: 8192
        thinking: true
        thinking_level: "high"
      - id: "minimax-m2.7:cloud"
        name: "MiniMax M2.7 (cloud)"
        max_tokens: 8192
      - id: "glm-5.1:cloud"
        name: "GLM-5.1 (cloud)"
        max_tokens: 8192
        thinking: true
        thinking_level: "medium"
      - id: "kimi-k2.6:cloud"
        name: "Kimi-K2.6 (cloud)"
        max_tokens: 8192
        thinking: true
        thinking_level: "medium"
      - id: "ministral-3:14b-cloud"
        name: "Ministral 3 14B (cloud)"
        max_tokens: 8192
      - id: "devstral-2:123b-cloud"
        name: "Devstral 2 123B (cloud)"
        max_tokens: 8192

      # --- Local models: general (vision-capable models flagged with
      #     ``vision: true``; the /api/show probe confirms this live) ---
      - id: "gemma4:latest"
        name: "Gemma 4"
        max_tokens: 8192

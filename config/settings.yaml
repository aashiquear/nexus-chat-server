        thinking_level: "medium"
        vision: true
      - id: "gemma4:31b"
        name: "Gemma 4 31B"
        max_tokens: 8192
        thinking: true
        thinking_level: "medium"
        vision: true
      - id: "gemma3:12b"
        name: "Gemma 3 12B"
        max_tokens: 8192
        vision: true
      - id: "qwen3.5-vl:latest"
        name: "Qwen 3.5 VL"
        max_tokens: 8192
        vision: true
      - id: "qwen3-vl:8b"
        name: "Qwen 3 VL 8B"
        max_tokens: 8192
        vision: true
      - id: "llama4:scout"
        name: "Llama 4 Scout"
        max_tokens: 8192
        vision: true
      - id: "mistral-small3.2:latest"
        name: "Mistral Small 3.2"
        max_tokens: 8192
        vision: true
      - id: "llava:13b"
        name: "LLaVA 13B"
        max_tokens: 4096
        vision: true
      - id: "minicpm-v:latest"
        name: "MiniCPM-V"
        max_tokens: 4096
        vision: true
      - id: "granite3.2-vision:latest"

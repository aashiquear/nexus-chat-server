# ------------------------------------------------------------
# Generation & context defaults
# ------------------------------------------------------------
# Defaults for the prompt-box settings control. "local" applies to
# Ollama (self-hosted) models, "cloud" to Anthropic / OpenAI / Ollama
# Cloud. Users can change every value from the UI (stored per browser;
# per user in the server edition). Compaction keeps long chats inside the
# context window: "off" | "truncate" (drop oldest turns) | "summarize"
# (replace oldest turns with a model-written summary) once the prompt
# exceeds threshold × context size.
# ------------------------------------------------------------
generation:
  context_sizes: [2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144]
  defaults:
    local:
      num_ctx: 8192
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.9
      top_k: 40
      repeat_penalty: 1.1
      keep_alive: "10m"
      compaction:
        mode: "summarize"
        threshold: 0.8
        keep_recent: 6
    cloud:
      context_window: 200000
      max_tokens: 4096
      temperature: 0.7
      compaction:
        mode: "summarize"
        threshold: 0.85
        keep_recent: 8

# ------------------------------------------------------------
# Tool selection (dynamic discovery)
# ------------------------------------------------------------
# With mode "auto" the router attaches only the tools relevant to each
# request: the "core" set (calculator, date/time, web search, web browser,
# code executor, memory, discover_tools) plus up to max_tools matches
# ranked by keyword + embedding similarity against the catalog
# (backend/tools/catalog.py) and connected MCP tools. The model can pull
# in more with the discover_tools meta tool. Tools the user ticks in the
# sidebar are "pinned" and always attached. mode "manual" restores the
# classic behaviour (only ticked tools). Tool modules are imported lazily,
# so enabling every tool below does not slow startup.
# ------------------------------------------------------------
tool_selection:
  mode: "auto"
  max_tools: 8
  min_score: 0.25
  include_core: true

# ------------------------------------------------------------
# Tools
# ------------------------------------------------------------
# Each tool is a Python module in backend/tools/ (see catalog.py for the
# module map and metadata). Set enabled: true/false to toggle tools.
# To add a new tool:
#   1. Create a Python file in backend/tools/ and @register_tool it
#   2. Add it to backend/tools/catalog.py (module, category, tags)
#   3. Add an entry here
# ------------------------------------------------------------
tools:
  calculator:
    enabled: true
    name: "Calculator"
    description: "Exact arithmetic with a safe expression parser"
    icon: "calculator"

  math_solver:
    enabled: true
    name: "Math Solver"
    description: "Symbolic algebra & calculus (SymPy): solve, simplify, differentiate, integrate, matrices"
    icon: "sigma"

  unit_converter:
    enabled: true
    name: "Unit Converter"
    description: "Convert physical units with dimensional checking"
    icon: "ruler"

  statistics_analyze:
    enabled: true
    name: "Statistics"
    description: "Descriptive stats, correlation, regression, t-tests on numbers or uploaded columns"
    icon: "bar-chart"

  datetime_calculate:
    enabled: true
    name: "Date Calculator"
    description: "Date differences, business days, holidays, timezone conversion"
    icon: "calendar"

  currency_convert:
    enabled: true
    name: "Currency"
    description: "Currency conversion with dated ECB rates"
    icon: "coins"

  text_utilities:
    enabled: true
    name: "Text Utilities"
    description: "Counts, diffs, regex, hashes, encodings, random values"
    icon: "type"

  json_tools:
    enabled: true
    name: "JSON Tools"
    description: "Validate, query, transform JSON/YAML; JSON Schema validation"
    icon: "braces"

  document_search:
    enabled: true
    name: "Document Search"
    description: "Find passages in uploaded documents with page numbers; extract tables"
    icon: "file-search"

  data_sql:
    enabled: true
    name: "SQL on Files"
    description: "Run SQL (DuckDB) across uploaded CSV/Parquet/JSON/Excel files"
    icon: "database"

  academic_search:
    enabled: true
    name: "Academic Search"
    description: "Search arXiv, Crossref and OpenAlex; resolve DOIs; BibTeX"
    icon: "graduation-cap"

  change_tracker:
    enabled: true
    name: "Change Tracker"
    description: "Snapshot web pages or files and report what changed"
    icon: "git-compare"

  memory:
    enabled: true
    name: "Memory"
    description: "Long-term memory of user facts, preferences and decisions"
    icon: "brain"

  tasks_manage:
    enabled: true
    name: "Tasks"
    description: "Personal to-do list with due dates and priorities"
    icon: "list-checks"

  decision_compare:
    enabled: true
    name: "Decision Matrix"
    description: "Weighted criteria comparison with sensitivity analysis"
    icon: "scale"

  discover_tools:
    enabled: true
    name: "Tool Discovery"
    description: "Lets the model attach additional tools on demand"
    icon: "search"

  web_search:
    enabled: true
    name: "Web Search"
    description: "Search the web for real-time, current, or factual information including weather, news, sports, finance, and dictionary lookups."
    icon: "search"
    config:
      api_key: "${SEARCH_API_KEY}"
      engine: "duckduckgo" # or "google", "bing"

  code_executor:
    enabled: true
    name: "Code Executor"
    description: "Run Python, JavaScript/TypeScript, Bash, Java, C/C++, Go, Rust, R or HTML in the sandbox; installs packages on the fly and returns produced files"
    icon: "code"
    config:
      timeout: 120
      max_memory_mb: 512
      # sandbox_url: "http://nexus-sandbox:8500"   # or set NEXUS_SANDBOX_URL

  web_browser:
    enabled: true
    name: "Web Browser"
    description: "Open a URL and read the page text (HTML, PDF, JSON) — lets the model read sources newer than its training data"
    icon: "globe"
    config:
      timeout: 25
      block_private_hosts: true

  csv_viewer:
    enabled: true
    name: "CSV Viewer"
    description: "Inspect CSV/TSV/Excel uploads: columns, types, preview rows and statistics, shown as an interactive table"
    icon: "table"

  datetime_tool:
    enabled: true
    name: "Date & Time"
    description: "Get current date, time, and timezone info"
    icon: "clock"

  file_reader:
    enabled: true
    name: "File Reader"
    description: "Read and parse uploaded files"
    icon: "file-text"

  svg_diagram:
    enabled: true
    name: "SVG Diagram"
    description: "Generate SVG architecture diagrams from descriptions"
    icon: "image"
    config:
      output_dir: "./data/uploads"

  graph_plotter:
    enabled: true
    name: "Graph Plotter"
    description: "Plot graphs (line, scatter, scatter_line, bar, grouped_bar, stacked_bar, count, pie, histogram, box, violin, area, heatmap, parity, regression) with advanced formatting"
    icon: "bar-chart"
    config:
      upload_dir: "./data/uploads"
